# ===========================================
# Painel de Gerenciamento (manager.localhost)
# ===========================================
server {
    listen 80;
    server_name manager.localhost;

    root /var/www/manager/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-manager:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ===========================================
# Localhost raiz redireciona para o manager
# ===========================================
server {
    listen 80;
    server_name localhost;

    return 302 http://manager.localhost;
}
