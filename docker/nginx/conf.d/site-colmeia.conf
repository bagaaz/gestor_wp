# ===========================================
# WordPress: colmeia
# Acesso: http://colmeia.localhost
# ===========================================
server {
    listen 80;
    server_name colmeia.localhost;

    root /var/www/sites/colmeia;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 256M;

    # Logs separados por site
    access_log /var/log/nginx/colmeia-access.log;
    error_log /var/log/nginx/colmeia-error.log;

    # WordPress Permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Permitir SVG e WebP
    location ~* \.(svg|svgz)$ {
        add_header Content-Type "image/svg+xml";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location ~* \.(webp)$ {
        add_header Content-Type "image/webp";
        try_files $uri =404;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|otf|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\.ht {
        deny all;
    }

    location ~ /wp-config\.php {
        deny all;
    }

    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    location ~* /wp-includes/.*\.php$ {
        deny all;
    }

    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }
}
