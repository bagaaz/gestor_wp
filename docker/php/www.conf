[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Timeout
request_terminate_timeout = 300

; Logs
catch_workers_output = yes
decorate_workers_output = no

; Clear env
clear_env = no
