; ==================================================
; PHP Config otimizado para WordPress Development
; ==================================================

; Upload de arquivos grandes
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 50

; Memória e execução
memory_limit = 4G
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Erros (modo desenvolvimento)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php/error.log

; Timezone
date.timezone = America/Sao_Paulo

; Sessões
session.save_handler = files
session.gc_maxlifetime = 3600

; OPCache (desabilitado para dev)
opcache.enable = 0
opcache.enable_cli = 0

; Email via Mailpit
sendmail_path = "/usr/bin/msmtp -t"

; Segurança básica
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Charset
default_charset = "UTF-8"
mbstring.language = Portuguese
; mbstring.internal_encoding deprecated no PHP 8.x (usa default_charset)
; mbstring.internal_encoding = UTF-8

; Realpath cache (performance)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
