services:
  # ===========================================
  # NGINX - Reverse Proxy & Web Server
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: wp-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./sites:/var/www/sites
      - ./manager/public:/var/www/manager/public
    depends_on:
      - php
      - php-manager
    networks:
      - wp-network
    restart: unless-stopped

  # ===========================================
  # PHP-FPM - Para sites WordPress
  # ===========================================
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: wp-php
    volumes:
      - ./sites:/var/www/sites
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    depends_on:
      - mysql
      - mailpit
    networks:
      - wp-network
    restart: unless-stopped

  # ===========================================
  # PHP-FPM - Para o painel Laravel Manager
  # ===========================================
  php-manager:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.manager
    container_name: wp-php-manager
    volumes:
      - ./manager:/var/www/manager
      - .:/var/www/project
      - ./sites:/var/www/sites
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=wp_manager
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - wp-network
    restart: unless-stopped

  # ===========================================
  # MySQL 8.0
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: wp-mysql
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - wp-network
    restart: unless-stopped

  # ===========================================
  # phpMyAdmin
  # ===========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wp-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    depends_on:
      - mysql
    networks:
      - wp-network
    restart: unless-stopped

  # ===========================================
  # Mailpit - Servidor de emails para teste
  # ===========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: wp-mailpit
    ports:
      - "8025:8025"   # Interface web
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - wp-network
    restart: unless-stopped

  # ===========================================
  # WP-CLI - Ferramenta de linha de comando
  # ===========================================
  wpcli:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: wp-cli
    entrypoint: ["wp", "--allow-root"]
    volumes:
      - ./sites:/var/www/sites
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    depends_on:
      - mysql
    networks:
      - wp-network
    profiles:
      - cli

volumes:
  mysql_data:
    driver: local

networks:
  wp-network:
    driver: bridge
