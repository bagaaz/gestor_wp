# ===========================================
# WP Manager - Painel Laravel
# Acesso: https://wp.devconecta.com.br
# Colocar em: /etc/nginx/sites-available/wp-manager.conf
# Ativar com: ln -s /etc/nginx/sites-available/wp-manager.conf /etc/nginx/sites-enabled/
# ===========================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name wp.devconecta.com.br;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name wp.devconecta.com.br;

    ssl_certificate     /etc/ssl/cloudflare/devconecta.com.br.crt;
    ssl_certificate_key /etc/ssl/cloudflare/devconecta.com.br.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /var/www/gestor_wp/manager/public;
    index index.php;

    charset utf-8;
    client_max_body_size 100M;

    access_log /var/log/nginx/wp-manager-access.log;
    error_log  /var/log/nginx/wp-manager-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }
}
